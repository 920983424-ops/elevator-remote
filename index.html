<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>电梯遥控器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a2e; color: #eee;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
        }
        .status {
            margin-top: 20px; padding: 10px 24px; border-radius: 20px;
            font-size: 14px; font-weight: 600;
        }
        .status.disconnected { background: #e74c3c; }
        .status.connected    { background: #27ae60; }
        h1 { margin: 20px 0 10px; font-size: 22px; color: #ccc; }
        .info { font-size: 13px; color: #888; margin-bottom: 10px; text-align: center; max-width: 320px; }
        #log {
            width: 90%; max-width: 360px; height: 120px;
            background: #111; color: #0f0; font-size: 11px; font-family: monospace;
            padding: 8px; border-radius: 8px; overflow-y: auto;
            margin: 8px 0; white-space: pre-wrap; word-break: break-all;
        }
        .btn-wrap {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            gap: 14px; width: 100%; max-width: 320px; padding: 0 30px 30px;
        }
        .btn {
            flex: 1; min-height: 70px; border: none; border-radius: 16px;
            font-size: 26px; font-weight: 700; letter-spacing: 4px;
            color: #fff; cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); box-shadow: 0 0 30px rgba(255,255,255,0.3); }
        .btn:disabled { opacity: 0.3; pointer-events: none; }
        .btn-1f { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .btn-2f { background: linear-gradient(135deg, #bdc3c7, #95a5a6); }
        .btn-3f { background: linear-gradient(135deg, #2c3e50, #1a1a2e); }
        .connect-btn {
            padding: 10px 36px; border: 2px solid #3498db; border-radius: 30px;
            background: transparent; color: #3498db; font-size: 15px; font-weight: 600;
            cursor: pointer; margin: 5px 0;
        }
        .connect-btn:active { background: #3498db; color: #fff; }
        .toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(39,174,96,0.95); color: #fff;
            padding: 16px 32px; border-radius: 12px;
            font-size: 24px; font-weight: 700; pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="status disconnected" id="status">未连接</div>
    <h1>🛗 电梯遥控器</h1>
    <div class="info" id="info">打开 F12 → Console 查看调试日志</div>

    <button class="connect-btn" id="connectBtn" onclick="connect()">🔗 连接集线器</button>

    <div id="log">等待连接...</div>

    <div class="btn-wrap">
        <button class="btn btn-1f" id="btn1" disabled onclick="sendFloor(1)">🟣 1 楼</button>
        <button class="btn btn-2f" id="btn2" disabled onclick="sendFloor(2)">⚪ 2 楼</button>
        <button class="btn btn-3f" id="btn3" disabled onclick="sendFloor(3)">⚫ 3 楼</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 尝试方案1: Pybricks命令服务 / 方案2: NUS裸通道
        const PYB_SERVICE = "c5f50001-8280-46da-89f4-6d8051e4aeef";
        const PYB_COMMAND = "c5f50002-8280-46da-89f4-6d8051e4aeef";
        const NUS_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_RX      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let device = null;
        let txChar = null;      // 用于发送的通道

        function log(msg) {
            console.log("[电梯]", msg);
            const el = document.getElementById("log");
            el.textContent += msg + "\n";
            el.scrollTop = el.scrollHeight;
        }

        function toast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.className = "toast show";
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.className = "toast", 1200);
        }

        function setConnected(ok) {
            document.getElementById("status").textContent = ok ? "已连接" : "未连接";
            document.getElementById("status").className = "status " + (ok ? "connected" : "disconnected");
            document.getElementById("btn1").disabled = !ok;
            document.getElementById("btn2").disabled = !ok;
            document.getElementById("btn3").disabled = !ok;
            document.getElementById("connectBtn").style.display = ok ? "none" : "block";
        }

        function onDisconnect() {
            log("⚠ 集线器断开连接");
            setConnected(false);
            toast("已断开");
        }

        async function connect() {
            try {
                log("🔍 正在扫描蓝牙设备...");

                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [PYB_SERVICE, NUS_SERVICE]
                });
                log("📱 已选择设备: " + (device.name || "(未知名称)"));
                log("  设备ID: " + device.id);

                log("🔗 正在建立GATT连接...");
                const server = await device.gatt.connect();
                log("✅ GATT连接成功");

                // 尝试方案1: NUS 裸通道（推荐，数据直通stdin）
                try {
                    log("🔍 尝试NUS服务...");
                    const nus = await server.getPrimaryService(NUS_SERVICE);
                    log("✅ 找到NUS服务");

                    txChar = await nus.getCharacteristic(NUS_TX);
                    log("✅ NUS TX特征就绪, 属性: " + JSON.stringify({
                        write: txChar.properties.write,
                        writeWithoutResponse: txChar.properties.writeWithoutResponse,
                    }));

                    // 订阅RX用于调试
                    const rxChar = await nus.getCharacteristic(NUS_RX);
                    if (rxChar.properties.notify) {
                        await rxChar.startNotifications();
                        rxChar.addEventListener("characteristicvaluechanged", (e) => {
                            const data = new Uint8Array(e.target.value.buffer);
                            log("📩 NUS收到: " + Array.from(data).map(b=>"0x"+b.toString(16).padStart(2,"0")).join(" "));
                        });
                    }
                    log("🎯 使用NUS裸通道（无需协议前缀）");

                } catch (e1) {
                    log("⚠ NUS不可用: " + e1.message);
                    log("🔍 回退到Pybricks命令服务...");

                    const pyb = await server.getPrimaryService(PYB_SERVICE);
                    txChar = await pyb.getCharacteristic(PYB_COMMAND);
                    log("✅ Pybricks命令特征就绪");
                    log("  属性: " + JSON.stringify({
                        write: txChar.properties.write,
                        writeWithoutResponse: txChar.properties.writeWithoutResponse,
                        notify: txChar.properties.notify,
                    }));

                    if (txChar.properties.notify) {
                        await txChar.startNotifications();
                        txChar.addEventListener("characteristicvaluechanged", (e) => {
                            const data = new Uint8Array(e.target.value.buffer);
                            log("📩 PYB收到: " + Array.from(data).map(b=>"0x"+b.toString(16).padStart(2,"0")).join(" "));
                        });
                    }
                    log("🎯 使用Pybricks命令服务（带协议前缀）");
                }

                device.addEventListener("gattserverdisconnected", onDisconnect);
                setConnected(true);
                log("🎉 一切就绪");
                toast("已连接 ✅");

            } catch (e) {
                log("❌ 连接失败: " + e.message);
                log("   错误类型: " + e.name);
                alert("连接失败: " + e.message + "\n\n查看Console (F12) 了解更多日志");
            }
        }

        // txChar 可能是 NUS TX 或 PYB Command，根据实际通道决定发送格式
        let useNus = true;  // connect()中会更新

        async function sendFloor(n) {
            if (!txChar) { log("❌ 未连接"); return; }
            try {
                const data = new Uint8Array([0x30 + n]);
                log("📤 发送: " + Array.from(data).map(b=>"0x"+b.toString(16).padStart(2,"0")).join(" ") + " (" + String.fromCharCode(0x30+n) + " = " + n + "楼)");

                // NUS 裸通道：直接写原始字节，数据直通stdin
                if (txChar.properties.writeWithoutResponse) {
                    await txChar.writeValueWithoutResponse(data);
                } else {
                    await txChar.writeValue(data);
                }

                log("✅ 发送完成");
                toast((n === 1 ? "🟣" : n === 2 ? "⚪" : "⚫") + " 去 " + n + " 楼");

            } catch (e) {
                log("❌ 发送失败: " + e.message);
            }
        }
    </script>
</body>
</html>
