<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>电梯遥控器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#1a1a2e;color:#eee;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center}
.status{margin-top:20px;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600}
.status.off{background:#e74c3c}.status.on{background:#27ae60}
h1{margin:20px 0 10px;font-size:22px;color:#ccc}
.info{font-size:13px;color:#888;margin-bottom:10px}
.btn-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;width:100%;max-width:320px;padding:0 30px 40px}
.btn{flex:1;min-height:80px;border:none;border-radius:16px;font-size:28px;font-weight:700;letter-spacing:4px;color:#fff;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn-1f{background:linear-gradient(135deg,#9b59b6,#8e44ad)}
.btn-2f{background:linear-gradient(135deg,#bdc3c7,#95a5a6)}
.btn-3f{background:linear-gradient(135deg,#2c3e50,#1a1a2e)}
.cn-btn{padding:10px 36px;border:2px solid #3498db;border-radius:30px;background:transparent;color:#3498db;font-size:15px;font-weight:600;cursor:pointer;margin:5px 0}
.cn-btn:active{background:#3498db;color:#fff}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(39,174,96,.95);color:#fff;padding:16px 32px;border-radius:12px;font-size:24px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="status off" id="s">未连接</div>
<h1>🛗 电梯遥控器</h1>
<div class="info">先连蓝牙，再选楼层</div>

<button class="cn-btn" id="cb" onclick="connect()">🔗 连接集线器</button>

<div class="btn-wrap">
  <button class="btn btn-1f" id="b1" disabled onclick="go(1)">🟣 1 楼</button>
  <button class="btn btn-2f" id="b2" disabled onclick="go(2)">⚪ 2 楼</button>
  <button class="btn btn-3f" id="b3" disabled onclick="go(3)">⚫ 3 楼</button>
</div>

<div class="toast" id="t"></div>

<script>
const PYB_SVC="c5f50001-8280-46da-89f4-6d8051e4aeef";
const PYB_CMD="c5f50002-8280-46da-89f4-6d8051e4aeef";

let dev,cmd;

function toast(m){
  const t=document.getElementById("t");
  t.textContent=m;t.className="toast show";
  clearTimeout(t._x);t._x=setTimeout(()=>t.className="toast",1200);
}

function setOk(v){
  document.getElementById("s").textContent=v?"已连接":"未连接";
  document.getElementById("s").className="status "+(v?"on":"off");
  document.getElementById("b1").disabled=!v;
  document.getElementById("b2").disabled=!v;
  document.getElementById("b3").disabled=!v;
  document.getElementById("cb").style.display=v?"none":"block";
}

async function connect(){
  try{
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[PYB_SVC]});
    const srv=await dev.gatt.connect();
    const pyb=await srv.getPrimaryService(PYB_SVC);
    cmd=await pyb.getCharacteristic(PYB_CMD);

    // 订阅通知（握手+接收回显）
    if(cmd.properties.notify){
      await cmd.startNotifications();
      cmd.addEventListener("characteristicvaluechanged",(e)=>{
        const d=new Uint8Array(e.target.value.buffer);
        const hex=Array.from(d).map(b=>"0x"+b.toString(16).padStart(2,"0")).join(" ");
        console.log("[HUB] "+hex+" | "+new TextDecoder().decode(d.filter(b=>b>=32&&b<127)));
      });
    }

    dev.addEventListener("gattserverdisconnected",()=>{setOk(false);toast("已断开")});
    setOk(true);
    toast("已连接 ✅");
  }catch(e){alert("连接失败: "+e.message)}
}

async function go(n){
  if(!cmd)return;
  try{
    // Pybricks命令特征 + [0x06, 字节] → stdin ✅
    await cmd.writeValue(new Uint8Array([0x06,0x30+n]));
    toast((n==1?"🟣":n==2?"⚪":"⚫")+" 去 "+n+" 楼");
  }catch(e){alert("发送失败: "+e.message)}
}
</script>
</body>
</html>
